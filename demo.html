<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Customer Intelligence Platform</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(74, 144, 226, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            animation: gradient 20s ease infinite;
            z-index: 0;
        }

        @keyframes gradient {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(5%, -5%) rotate(120deg); }
            66% { transform: translate(-5%, 5%) rotate(240deg); }
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow:
                0 8px 32px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.05),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 90vh;
            max-height: 900px;
            position: relative;
            z-index: 1;
        }

        .header {
            background: linear-gradient(135deg, rgba(30, 30, 45, 0.8) 0%, rgba(20, 20, 30, 0.9) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            color: white;
            padding: 32px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #4A90E2 0%, #6366F1 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
        }

        .brand-text h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .brand-text p {
            font-size: 13px;
            opacity: 0.6;
            font-weight: 400;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            color: #10b981;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .reset-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        .reset-btn:active {
            transform: translateY(0);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            background: transparent;
        }

        .message {
            margin-bottom: 32px;
            animation: slideUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .assistant .avatar {
            background: linear-gradient(135deg, #4A90E2 0%, #6366F1 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .user .avatar {
            background: linear-gradient(135deg, #EC4899 0%, #F97316 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
        }

        .role-label {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: -0.01em;
        }

        .message-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
        }

        .message-bubble {
            padding: 20px 24px;
            border-radius: 16px;
            max-width: 85%;
            line-height: 1.7;
            font-size: 14.5px;
            font-weight: 400;
            position: relative;
        }

        .assistant .message-bubble {
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.15) 0%, rgba(99, 102, 241, 0.15) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
            color: rgba(255, 255, 255, 0.95);
            margin-left: 48px;
            border-top-left-radius: 4px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .user .message-bubble {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.15) 0%, rgba(249, 115, 22, 0.15) 100%);
            border: 1px solid rgba(236, 72, 153, 0.2);
            color: rgba(255, 255, 255, 0.95);
            margin-left: auto;
            margin-right: 0;
            border-top-right-radius: 4px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .user .message-header {
            justify-content: flex-end;
        }

        .user .message-bubble {
            text-align: right;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
            margin-left: 48px;
            animation: fadeIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) 0.2s both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .suggestion-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.9);
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .suggestion-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3) 0%, rgba(74, 144, 226, 0.3) 100%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .suggestion-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        .suggestion-btn:hover::before {
            opacity: 1;
        }

        .suggestion-btn:active {
            transform: translateY(0);
        }

        .suggestion-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .typing-indicator {
            display: inline-flex;
            gap: 6px;
            padding: 20px 24px;
            background: linear-gradient(135deg, rgba(74, 144, 226, 0.15) 0%, rgba(99, 102, 241, 0.15) 100%);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            border-top-left-radius: 4px;
            margin-bottom: 32px;
            margin-left: 48px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            30% {
                opacity: 1;
                transform: translateY(-8px);
            }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.02);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
            background-clip: padding-box;
        }

        /* Smooth scroll */
        .chat-container {
            scroll-behavior: smooth;
        }

        .input-area {
            padding: 24px 40px;
            background: linear-gradient(135deg, rgba(30, 30, 45, 0.8) 0%, rgba(20, 20, 30, 0.9) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .message-input {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .message-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .message-input:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .send-btn {
            padding: 14px 24px;
            background: linear-gradient(135deg, #4A90E2 0%, #6366F1 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
            white-space: nowrap;
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .send-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .info-message {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15) 0%, rgba(245, 158, 11, 0.15) 100%);
            border: 1px solid rgba(251, 191, 36, 0.3);
            color: rgba(255, 255, 255, 0.9);
            padding: 16px 20px;
            border-radius: 12px;
            margin-top: 12px;
            font-size: 13px;
            line-height: 1.6;
        }

        .info-message strong {
            color: #fbbf24;
            display: block;
            margin-bottom: 4px;
        }

        .mic-btn {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .mic-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.5);
            color: rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
        }

        .mic-btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .mic-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .mic-btn.recording {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            border-color: #EF4444;
            color: white;
            animation: pulse-mic 1.5s ease-in-out infinite;
        }

        @keyframes pulse-mic {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(239, 68, 68, 0);
            }
        }

        .voice-status {
            position: absolute;
            bottom: -24px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            white-space: nowrap;
            font-weight: 500;
        }

        .voice-status.recording {
            color: #EF4444;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .container {
                max-height: 95vh;
                border-radius: 16px;
            }

            .header {
                padding: 24px 20px;
            }

            .brand-icon {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }

            .brand-text h1 {
                font-size: 18px;
            }

            .chat-container {
                padding: 24px 20px;
            }

            .message-bubble {
                max-width: 90%;
            }

            .suggestions {
                margin-left: 0;
            }

            .typing-indicator {
                margin-left: 0;
            }

            .input-area {
                padding: 16px 20px;
                gap: 8px;
            }

            .send-btn {
                padding: 14px 20px;
            }

            .mic-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }

            .voice-status {
                font-size: 10px;
                bottom: -20px;
            }
        }

        /* Insight Cards */
        .insight-dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin: 24px 40px;
            animation: slideUp 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .insight-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .insight-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--card-color-1), var(--card-color-2));
            opacity: 0.8;
        }

        .insight-card.critical {
            --card-color-1: #EF4444;
            --card-color-2: #DC2626;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .insight-card.warning {
            --card-color-1: #F59E0B;
            --card-color-2: #D97706;
            border-color: rgba(245, 158, 11, 0.3);
        }

        .insight-card.success {
            --card-color-1: #10B981;
            --card-color-2: #059669;
            border-color: rgba(16, 185, 129, 0.3);
        }

        .insight-card.info {
            --card-color-1: #3B82F6;
            --card-color-2: #2563EB;
            border-color: rgba(59, 130, 246, 0.3);
        }

        .insight-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .insight-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .insight-card-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.05);
        }

        .insight-card-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .critical .insight-card-badge {
            background: rgba(239, 68, 68, 0.2);
            color: #FCA5A5;
        }

        .warning .insight-card-badge {
            background: rgba(245, 158, 11, 0.2);
            color: #FCD34D;
        }

        .success .insight-card-badge {
            background: rgba(16, 185, 129, 0.2);
            color: #6EE7B7;
        }

        .info .insight-card-badge {
            background: rgba(59, 130, 246, 0.2);
            color: #93C5FD;
        }

        .insight-card-title {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin: 8px 0 4px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .insight-card-value {
            font-size: 28px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .insight-card-description {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .insight-card-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            transition: all 0.2s;
        }

        .insight-card-action:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(2px);
        }

        .dashboard-header {
            margin: 24px 40px 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dashboard-title {
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .dashboard-subtitle {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            .insight-dashboard {
                grid-template-columns: 1fr;
                margin: 16px 20px;
            }

            .dashboard-header {
                margin: 16px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="brand">
                    <div class="brand-icon">AI</div>
                    <div class="brand-text">
                        <h1>AI Customer Intelligence</h1>
                        <p>Enterprise Network Operations</p>
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 16px;">
                    <div class="status-badge">
                        <div class="status-dot"></div>
                        <span>Connected</span>
                    </div>
                    <button class="reset-btn" onclick="resetChat()">Reset</button>
                </div>
            </div>
        </div>
        <div class="chat-container" id="chatContainer">
            <!-- Messages will be inserted here -->
        </div>
        <div class="input-area">
            <div class="input-wrapper">
                <input
                    type="text"
                    id="messageInput"
                    class="message-input"
                    placeholder="Ask me anything about your network, security, or infrastructure..."
                    autocomplete="off"
                />
            </div>
            <button id="micBtn" class="mic-btn" onclick="toggleVoiceInput()" title="Click to speak">
                <span id="micIcon">🎤</span>
                <div id="voiceStatus" class="voice-status" style="display: none;"></div>
            </button>
            <button id="sendBtn" class="send-btn" onclick="sendCustomMessage()">Send</button>
        </div>
    </div>

    <script>
        let currentPersona = null;
        let personaConversations = {};

        // Network Ops Persona
        personaConversations["Network Ops (Global)"] = [
            {
                role: "assistant",
                text: "Network Operations dashboard initialized. I've autonomously analyzed your global infrastructure: 847 sites, 18,642 devices, 2.4M network flows/sec. I'm continuously predicting issues before they occur, auto-optimizing performance, and self-healing failures. **Proactive Alert**: I've already identified 3 issues requiring your attention this morning. Where should I send critical alerts?",
                suggestions: ["Webex + Email", "Teams only", "Email only"]
            },
            { role: "user", text: "Webex + Email" },

                        question: "Show auto-remediation suggestions"
                    }
                ]
            },
            "Executive Overview": {
                title: "Executive Dashboard",
                subtitle: "Strategic KPIs, risks, and business impact at a glance",
                cards: [
                    {
                        type: "success",
                        icon: "📈",
                        badge: "Performance",
                        title: "Availability",
                        value: "99.94%",
                        description: "Above SLA target, 47 incidents (↓12% QoQ)",
                        action: "View KPIs →",
                        question: "Show me KPIs"
                    },
                    {
                        type: "warning",
                        icon: "⚠️",
                        badge: "Risk Alert",
                        title: "Top Risks",
                        value: "3",
                        description: "Critical CVE, EOL equipment, capacity constraints",
                        action: "Assess Risk →",
                        question: "What are my top risks?"
                    },
                    {
                        type: "success",
                        icon: "💵",
                        badge: "Savings",
                        title: "Cost Optimization",
                        value: "$4.1M",
                        description: "Annual savings identified through license and contract optimization",
                        action: "See Breakdown →",
                        question: "Show financial impact"
                    },
                    {
                        type: "info",
                        icon: "🎯",
                        badge: "Strategy",
                        title: "Initiatives",
                        value: "5",
                        description: "Active projects: ACI migration, security remediation, ELA renegotiation",
                        action: "View Projects →",
                        question: "What projects are in flight?"
                    }
                ]
            }
        };

        // Voice recognition variables
        let recognition = null;
        let isRecording = false;

        // Initialize Web Speech API
        function initVoiceRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onstart = function() {
                    isRecording = true;
                    const micBtn = document.getElementById('micBtn');
                    const voiceStatus = document.getElementById('voiceStatus');
                    micBtn.classList.add('recording');
                    voiceStatus.textContent = 'Listening...';
                    voiceStatus.style.display = 'block';
                    voiceStatus.classList.add('recording');
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    const input = document.getElementById('messageInput');
                    input.value = transcript;

                    // Auto-send after a brief delay
                    setTimeout(() => {
                        sendCustomMessage();
                    }, 500);
                };

                recognition.onerror = function(event) {
                    console.error('Speech recognition error:', event.error);
                    const voiceStatus = document.getElementById('voiceStatus');
                    voiceStatus.textContent = 'Error: ' + event.error;
                    setTimeout(stopVoiceRecording, 2000);
                };

                recognition.onend = function() {
                    stopVoiceRecording();
                };
            } else {
                console.warn('Speech recognition not supported');
                // Disable mic button
                const micBtn = document.getElementById('micBtn');
                if (micBtn) {
                    micBtn.disabled = true;
                    micBtn.title = 'Voice input not supported in this browser';
                }
            }
        }

        function toggleVoiceInput() {
            if (!recognition) {
                alert('Voice input is not supported in your browser. Please use Chrome, Edge, or Safari.');
                return;
            }

            if (isRecording) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }

        function stopVoiceRecording() {
            isRecording = false;
            const micBtn = document.getElementById('micBtn');
            const voiceStatus = document.getElementById('voiceStatus');
            micBtn.classList.remove('recording');
            voiceStatus.style.display = 'none';
            voiceStatus.classList.remove('recording');
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function getCurrentTime() {
            const now = new Date();
            return now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
        }

        function showTypingIndicator() {
            const typing = document.createElement('div');
            typing.className = 'typing-indicator';
            typing.innerHTML = '<span></span><span></span><span></span>';
            chatContainer.appendChild(typing);
            scrollToBottom();
            return typing;
        }

        function addMessage(role, text, suggestions = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatarLetter = role === 'assistant' ? 'AI' : 'U';
            const roleName = role === 'assistant' ? 'AI Assistant' : 'User';

            let html = `
                <div class="message-header">
                    ${role === 'assistant' ? `<div class="avatar">${avatarLetter}</div>` : ''}
                    <div class="role-label">${roleName}</div>
                    <div class="message-time">${getCurrentTime()}</div>
                    ${role === 'user' ? `<div class="avatar">${avatarLetter}</div>` : ''}
                </div>
                <div class="message-bubble">${text}</div>
            `;

            if (suggestions && suggestions.length > 0) {
                html += '<div class="suggestions">';
                suggestions.forEach((suggestion, index) => {
                    html += `<button class="suggestion-btn" onclick="handleSuggestionClick(${index})">${suggestion}</button>`;
                });
                html += '</div>';
            }

            messageDiv.innerHTML = html;
            chatContainer.appendChild(messageDiv);
            scrollToBottom();
        }

        // Display Insight Cards for selected persona
        function displayInsightCards(personaName) {
            const insights = personaInsights[personaName];
            if (!insights) return;

            // Create dashboard header
            const headerDiv = document.createElement('div');
            headerDiv.className = 'dashboard-header';
            headerDiv.innerHTML = `
                <div>
                    <div class="dashboard-title">${insights.title}</div>
                    <div class="dashboard-subtitle">${insights.subtitle}</div>
                </div>
            `;
            chatContainer.appendChild(headerDiv);

            // Create insight cards grid
            const dashboardDiv = document.createElement('div');
            dashboardDiv.className = 'insight-dashboard';

            insights.cards.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = `insight-card ${card.type}`;
                cardDiv.onclick = () => handleCardClick(card.question);

                cardDiv.innerHTML = `
                    <div class="insight-card-header">
                        <div class="insight-card-icon">${card.icon}</div>
                        <div class="insight-card-badge">${card.badge}</div>
                    </div>
                    <div class="insight-card-title">${card.title}</div>
                    <div class="insight-card-value">${card.value}</div>
                    <div class="insight-card-description">${card.description}</div>
                    <div class="insight-card-action">${card.action}</div>
                `;

                dashboardDiv.appendChild(cardDiv);
            });

            chatContainer.appendChild(dashboardDiv);
            scrollToBottom();
        }

        // Handle insight card clicks - start the full conversation flow
        function handleCardClick(question) {
            // Remove the insight cards
            const insightSection = document.querySelector('.insight-cards-section');
            if (insightSection) {
                insightSection.remove();
            }

            // Remove the "I've surfaced" message and its suggestions
            const messages = chatContainer.querySelectorAll('.message');
            const lastMessage = messages[messages.length - 1];
            if (lastMessage && lastMessage.textContent.includes("I've surfaced")) {
                lastMessage.remove();
            }

            // Start the actual conversation flow
            currentStep = -1; // Reset to beginning

            // Show the first message in the conversation
            setTimeout(() => {
                handleSuggestionClick(0); // This will trigger the first exchange
            }, 300);
        }

        function handleSuggestionClick(suggestionIndex) {
            const allButtons = document.querySelectorAll('.suggestion-btn');
            allButtons.forEach(btn => {
                btn.disabled = true;
            });

            // Check if this is persona selection (no persona set yet)
            if (!currentPersona) {
                const personaName = initialMessage.suggestions[suggestionIndex];
                currentPersona = personaName;
                conversation = personaConversations[personaName];
                currentStep = -1; // Will be incremented to 0

                // Show user selection
                addMessage('user', personaName);

                // Show insight cards instead of first message
                setTimeout(() => {
                    displayInsightCards(personaName);

                    // Add a helpful message about the cards
                    setTimeout(() => {
                        const typing = showTypingIndicator();
                        setTimeout(() => {
                            typing.remove();
                            addMessage('assistant',
                                "I've surfaced the most critical insights for you. Click any card to dive deeper, or ask me anything about your environment.",
                                ["What can you help me with?", "Show me everything", "File a TAC case"]
                            );
                        }, 800);
                    }, 600);
                }, 600);
                return;
            }

            // Regular conversation flow
            currentStep++;
            if (currentStep < conversation.length) {
                const userMessage = conversation[currentStep];
                addMessage(userMessage.role, userMessage.text);

                currentStep++;
                if (currentStep < conversation.length) {
                    setTimeout(() => {
                        const typing = showTypingIndicator();
                        setTimeout(() => {
                            typing.remove();
                            const assistantMessage = conversation[currentStep];
                            addMessage(assistantMessage.role, assistantMessage.text, assistantMessage.suggestions);
                        }, 1200);
                    }, 600);
                }
            }
        }

        function resetChat() {
            currentStep = 0;
            currentPersona = null;
            conversation = [];
            chatContainer.innerHTML = '';
            initChat();
        }

        function generateSmartResponse(userQuestion) {
            const lowerQ = userQuestion.toLowerCase();

            // If no persona selected yet, guide them to select one
            if (!currentPersona) {
                return {

                };
            }

            // Generic fallback
            return {
                text: `That's an interesting question for the ${currentPersona} persona! This is a guided demo showcasing specific workflows. I'd recommend using the suggestion buttons to explore the capabilities step-by-step, or ask about specific topics relevant to your role.`,
                showInfo: true

        }

        function sendCustomMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();

            if (!message) return;

            // Add user message
            addMessage('user', message);
            input.value = '';

            // Generate and show assistant response
            setTimeout(() => {
                const typing = showTypingIndicator();
                setTimeout(() => {
                    typing.remove();
                    const response = generateSmartResponse(message);

                    // Create custom message with info box
                    const messageDiv = document.createElement('div');
                    messageDiv.className = 'message assistant';

                    let html = `
                        <div class="message-header">
                            <div class="avatar">AI</div>
                            <div class="role-label">AI Assistant</div>
                            <div class="message-time">${getCurrentTime()}</div>
                        </div>
                        <div class="message-bubble">${response.text}</div>
                    `;

                    if (response.showInfo) {
                        html += `
                            <div class="info-message" style="margin-left: 48px;">
                                <strong>💡 Demo Mode</strong>
                                This is a prototype showcasing key capabilities. In production, I would provide real-time analysis of your actual infrastructure, with live data from Cisco DNA Center, vManage, SecureX, and Smart Licensing.
                            </div>
                        `;
                    }

                    messageDiv.innerHTML = html;
                    chatContainer.appendChild(messageDiv);
                    scrollToBottom();
                }, 1200);
            }, 600);
        }

        // Add Enter key support
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('messageInput');
            if (input) {
                input.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        sendCustomMessage();
                    }
                });
            }
        });

        function initChat() {
            const typing = showTypingIndicator();
            setTimeout(() => {
                typing.remove();
                addMessage(initialMessage.role, initialMessage.text, initialMessage.suggestions);
            }, 1200);
        }

        // Initialize on page load
        initChat();
        initVoiceRecognition();
    </script>
